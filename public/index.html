<!doctype html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Khách Sạn Bảo Bối 🏨</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#fff0f7;color:#84274f}main{max-width:760px;margin:auto;padding:15px}h1{text-align:center;font-size:clamp(24px,5vw,38px);margin:12px 0}header,.panel{background:white;border-radius:20px;padding:15px;margin:12px 0;box-shadow:0 4px 18px #ed9dc344}input,button{font:inherit;border-radius:12px;padding:12px;border:1px solid #f1b2d0}button{background:#e64b97;color:white;font-weight:700;cursor:pointer}button:active{transform:scale(.97)}input{max-width:100%;width:100%;margin:5px 0}#game{display:none}.map{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px;background:#f9c8df;padding:8px;border-radius:16px}.tile{aspect-ratio:1;background:#fff9fc;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-direction:column;position:relative;font-size:clamp(16px,4vw,29px);overflow:hidden}.tile.room{background:#f5a7cc}.tile.desk{background:#ffc8df}.tiny{font-size:10px}.occupied{background:#e890aa!important}.controls{display:flex;flex-direction:column;align-items:center;gap:5px}.controls button{min-width:64px;min-height:48px}.stats{display:flex;justify-content:space-around;flex-wrap:wrap;gap:8px}.row{display:flex;gap:8px}.row input{flex:1;min-width:0}.feed{height:135px;overflow:auto;background:#fff5fa;border-radius:10px;padding:10px;font-size:14px}#notice{min-height:40px;text-align:center;font-weight:600}small{color:#ad5680}a{color:#ad276a}</style></head><body><main><h1>🏨 Khách Sạn Bảo Bối 🎀</h1>
<section id="login" class="panel"><h2>Chào mừng công chúa! 💗</h2><label>Tên nhân vật<input id="name" maxlength="20" placeholder="Bảo bối"></label><label>Mã khách sạn<input id="code" maxlength="20" value="BAOBOI"></label><button id="join">Vào khách sạn ✨</button><p><small>Để chơi cùng nhau, các bạn nhập cùng mã khách sạn hoặc dùng link mời.</small></p></section>
<section id="game"><div class="panel stats"><span>💰 <b id="money">200</b> xu</span><span>🛏️ <b id="rooms">0/4</b> phòng</span><span>👥 <b id="online">1</b> online</span><span>🐰 Khách chờ: <b id="waiting">0</b></span></div><div id="notice" class="panel">Đi đến quầy lễ tân để nhận khách nhé!</div><div class="map" id="map"></div><p style="text-align:center"><small>👑 Em • 🧑‍🤝‍🧑 Bạn bè • 🛎️ Lễ tân • 🛏️ Phòng nghỉ</small></p><div class="panel controls"><button onclick="move(0,-1)">⬆️</button><div class="row"><button onclick="move(-1,0)">⬅️</button><button onclick="interact()">💗 Tương tác</button><button onclick="move(1,0)">➡️</button></div><button onclick="move(0,1)">⬇️</button></div><div class="panel"><button id="invite">🔗 Sao chép link mời bạn bè</button></div><div class="panel"><h3>💬 Trò chuyện</h3><div id="feed" class="feed"></div><form id="chatForm" class="row"><input id="chat" maxlength="120" placeholder="Nhắn với bạn bè..." autocomplete="off"><button>Gửi</button></form></div></section></main><script src="/socket.io/socket.io.js"></script><script>
const socket=io();let myId=null,state=null,roomCode='BAOBOI';const $=id=>document.getElementById(id);const query=new URLSearchParams(location.search);if(query.get('room'))$('code').value=query.get('room');
function say(s){$('notice').textContent=s}function addChat(n,m){const el=document.createElement('div');el.textContent=n+': '+m;$('feed').append(el);$('feed').scrollTop=$('feed').scrollHeight}
$('join').onclick=()=>{socket.emit('join',{name:$('name').value||'Bảo bối',code:$('code').value||'BAOBOI'});$('join').disabled=true};
socket.on('welcome',d=>{myId=d.id;roomCode=d.code;$('login').style.display='none';$('game').style.display='block';history.replaceState({},'',location.pathname+'?room='+encodeURIComponent(roomCode))});
socket.on('notice',say);socket.on('chat',d=>addChat(d.name,d.message));
socket.on('state',d=>{state=d;$('money').textContent=d.money;$('rooms').textContent=d.rooms.filter(r=>r.guest).length+'/4';$('online').textContent=Object.keys(d.players).length;$('waiting').textContent=d.queue.length;draw()});
function draw(){if(!state)return;const map=$('map');map.replaceChildren();for(let y=0;y<7;y++)for(let x=0;x<8;x++){const t=document.createElement('div');t.className='tile';const roomIndex=[1,3,5,7].indexOf(x);const room=y===0&&roomIndex>=0?state.rooms[roomIndex]:null;if(room){t.classList.add('room');if(room.guest)t.classList.add('occupied')}if(x===3&&y===3)t.classList.add('desk');const occupants=Object.entries(state.players).filter(([id,p])=>p.x===x&&p.y===y);let symbol=room?'🛏️':x===3&&y===3?'🛎️':x===0&&y===5?'🪴':x===6&&y===4?'🛋️':'·';if(occupants.length)symbol=occupants.some(([id])=>id===myId)?'👑':'🧑‍🤝‍🧑';t.textContent=symbol;if(room){const small=document.createElement('span');small.className='tiny';small.textContent=room.id+(room.guest?' 🔴':' 🟢');t.append(small)}map.append(t)}}
function move(dx,dy){socket.emit('move',{dx,dy})}
function interact(){if(!state)return;const p=state.players[myId];if(!p)return;if(Math.abs(p.x-3)+Math.abs(p.y-3)<=1){socket.emit('rent');return}for(const [i,x] of [1,3,5,7].entries())if(Math.abs(p.x-x)+p.y<=1){socket.emit('checkout',101+i);return}say('Đến quầy 🛎️ nhận khách hoặc cửa phòng 🛏️ trả phòng nhé!')}
document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA'].includes(document.activeElement.tagName))return;const d={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0]};if(d[e.key]){e.preventDefault();move(...d[e.key])}if(e.key===' ')interact()});
$('chatForm').onsubmit=e=>{e.preventDefault();socket.emit('chat',$('chat').value);$('chat').value=''};
$('invite').onclick=async()=>{try{await navigator.clipboard.writeText(location.href);say('Đã sao chép link! Gửi cho bạn bè nhé 💗')}catch(e){prompt('Sao chép link này:',location.href)}};
</script></body></html>
